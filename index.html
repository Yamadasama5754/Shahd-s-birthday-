<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيد ميلاد شهد</title>
<link rel="stylesheet" href="start.css">
</head>
<body>

<audio id="bgMusic" loop>
    <source src="hbd.mp3" type="audio/mpeg">
</audio>

<div class="screen" id="mainScreen">
    <img class="bg" src="assets/start-bg.png" alt="bg">

    <div class="menu-grid">
        <button class="menu-btn" id="btnStart" data-label="بدأ">
            <img src="https://h.top4top.io/p_3881e10sf0.jpg" alt="بدأ">
        </button>
        <button class="menu-btn" id="btnDesigns" data-label="تصاميم">
            <img src="https://k.top4top.io/p_3881p2bzh0.jpg" alt="تصاميم">
        </button>
        <button class="menu-btn" id="btnBirthday" data-label="عيد ميلاد">
            <img src="https://i.top4top.io/p_3881mi8070.jpg" alt="عيد ميلاد">
        </button>
        <button class="menu-btn" id="btnShare" data-label="مشاركة">
            <img src="https://a.top4top.io/p_3881qfr0e0.jpg" alt="مشاركة">
        </button>
        <button class="menu-btn" id="btnSettings" data-label="اعدادات">
            <img src="https://d.top4top.io/p_38810ti0f0.jpg" alt="اعدادات">
        </button>
        <button class="menu-btn" id="btnExit" data-label="خروج">
            <img src="https://i.top4top.io/p_3881sn01c0.jpg" alt="خروج">
        </button>
    </div>
</div>

<!-- Birthday image overlay -->
<div class="overlay" id="birthdayOverlay">
    <button class="close-btn" data-close="birthdayOverlay">✕</button>
    <img class="overlay-img" src="https://i.imgur.com/av4Gw9Z.jpeg" alt="عيد ميلاد شهد">
</div>

<!-- Designs gallery overlay -->
<div class="overlay" id="designsOverlay">
    <button class="close-btn" data-close="designsOverlay">✕</button>
    <h2 class="overlay-title">تصاميمي لك 💜</h2>
    <div class="gallery">
        <img src="https://i.imgur.com/RNIxxK3.jpeg" alt="تصميم">
        <img src="https://i.imgur.com/bHJFpyd.jpeg" alt="تصميم">
        <img src="https://i.imgur.com/J3TYD56.jpeg" alt="تصميم">
        <img src="https://i.imgur.com/uFkgpbt.jpeg" alt="تصميم">
        <img src="https://i.imgur.com/MkD0mW8.jpeg" alt="تصميم">
        <img src="https://i.imgur.com/CW16ys4.jpeg" alt="تصميم">
        <img src="https://i.imgur.com/XjC91rG.jpeg" alt="تصميم">
        <img src="https://i.imgur.com/thThlm4.jpeg" alt="تصميم">
        <img src="https://i.imgur.com/9BhnHiX.jpeg" alt="تصميم">
    </div>
</div>

<!-- Settings overlay -->
<div class="overlay" id="settingsOverlay">
    <button class="close-btn" data-close="settingsOverlay">✕</button>
    <h2 class="overlay-title" id="settingsTitle">الإعدادات</h2>

    <div class="settings-panel">
        <div class="setting-row">
            <span id="lblMute">كتم الصوت</span>
            <label class="switch">
                <input type="checkbox" id="muteToggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="setting-row column">
            <span id="lblVolume">حجم الصوت</span>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.6">
        </div>

        <div class="setting-row">
            <span id="lblLang">اللغة / Language</span>
            <div class="lang-switch">
                <button class="lang-btn active" data-lang="ar">عربي</button>
                <button class="lang-btn" data-lang="en">English</button>
            </div>
        </div>

        <button class="wide-btn" id="btnOpenDesigns2">
            <span id="lblDesigns">🎨 عرض التصاميم</span>
        </button>
    </div>
</div>

<!-- Exit overlay -->
<div class="overlay" id="exitOverlay">
    <img class="overlay-img exit-img" src="https://c.top4top.io/p_38811cq8k0.jpg" alt="خروج">
</div>

<div class="share-toast" id="shareToast">تم نسخ الرابط ✅</div>

<script src="start.js"></script>
</body>
</html>
