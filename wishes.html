<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CUSTOMIZE: Change the title -->
    <title data-i18n="pageTitle">أمنياتي لك 💖</title>
    <!-- CUSTOMIZE: Change favicon -->
    <link rel="icon" type="image/png" href="assets/start-bg.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="./wishes.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body data-page="wishes">
    <audio id="bgMusic" loop>
        <source src="hbd.mp3" type="audio/mpeg">
    </audio>
    <div class="music-toggle" id="musicToggle" title="Toggle Music">
        <span class="music-icon">🎵</span>
    </div>
    <a href="countdown.html" class="back-btn" title="عودة" data-i18n-attr="title:backTitle">←</a>
    <div class="custom-cursor">
        <svg viewBox="0 0 24 24">
            <path fill="#ff69b4" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
    </div>

    <div class="container">
        <!-- CUSTOMIZE: Change the name -->
        <h1 data-i18n="heading">كل عام وأنتِ بخير يا شهد 💖</h1>

        <div id="reasons-container"></div>

        <button class="shuffle-button" data-i18n="shuffle">اضغطي هنا... 💕</button>
        <div class="reason-counter"></div>

        <div class="ending-section">
            <div class="teddy-hug">
                <!-- CUSTOMIZE: Change the image -->
                <img src="./photos/photo-1.jpg" alt="Special Photo">
            </div>
            <!-- CUSTOMIZE: Change the ending text -->
            <div class="ending-text" data-i18n="ending">أنتِ الأفضل! 💖</div>
        </div>
    </div>

    <script src="site-language.js"></script>
    <script src="music.js"></script>
    <script src="wishes.js"></script>
</body>
</html>
